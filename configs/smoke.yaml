# Fast end-to-end pipeline check (~1 min). Numbers from this config are NOT results.
data_dir: data
results_dir: results_smoke

split:
  n_val_subjects: 5
  seed: 0

conditions: [acc, gyro, acc_gyro]
models: [logreg, cnn]
seeds: [0]

logreg:
  C_grid: [0.01]
  max_iter: 2000
  seeds: [0]

cnn:
  widths: [8, 16, 16]
  kernels: [7, 5, 3]
  dropout: 0.3

training:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 2
  patience: 1
  train_threads: 4
  log_every: 1

benchmark:
  warmup: 10
  iters: 50
  rounds: 1
  torch_threads: [1]
  seed: 0

robustness:
  enabled: true
  sigmas: [0.0, 0.5]
  targets: [all, gyro]
  repeats: 1
  seed: 1234
