[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionsense"
version = "0.1.0"
description = "Lightweight human activity recognition with accelerometer/gyroscope fusion (UCI HAR)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
